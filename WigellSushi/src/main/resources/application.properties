server.port=8582
server.error.include-message=always

spring.application.name=sushi

spring.boot.admin.client.url=http://localhost:9090
spring.boot.admin.client.instance.management-base-url=http://localhost:8582
spring.boot.admin.client.instance.metadata.user.name=a
spring.boot.admin.client.instance.metadata.user.password=1234

spring.datasource.url=jdbc:mysql://localhost:3306/wigell_sushi_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Stockholm
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Stockholm

spring.main.banner-mode=off
spring.main.log-startup-info=false

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

info.app.name=sushi
info.app.version=1.0.0

logging.level.root=INFO
logging.level.com.wigell.sushi=INFO